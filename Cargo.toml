[workspace]
members = [
    "verifier",
    "example/script",
    "example/program",
    "example/sp1-program",
]
resolver = "2"

[workspace.dependencies]

# workspace
sp1-solana = { path = "verifier" }
fibonacci-verifier-contract = { path = "example/program" }

# solana (Agave 3.x line). The 3.x SDK is split into per-concern crates;
# the `solana-sdk` umbrella only re-exports them behind deprecation warnings,
# so the client depends on the granular crates directly.
solana-program = "3.0"
solana-sha256-hasher = "3.0"
solana-blake3-hasher = "3.0"
solana-rpc-client = "3.1"
solana-rpc-client-api = "3.1"
solana-commitment-config = "3.0"
solana-compute-budget-interface = "3.0"
solana-transaction = "3.0"
solana-transaction-status-client-types = "3.1"
solana-instruction = "3.0"
solana-keypair = "3.0"
solana-signer = "3.0"
solana-pubkey = "3.0"
borsh = "1.5.1"

# light protocol groth16 verifier — unreleased master, pinned.
# 0.2.0 (crates.io) predates negate_g1_be, vk_commitment, pinocchio syscalls.
groth16-solana = { git = "https://github.com/Lightprotocol/groth16-solana", rev = "43fee1a67e91c0df7bb4edad5ba87ae4602aa208" }

# misc
tokio = "1.40.0"
sha2 = "0.10.8"
hex = { version = "0.4.3", default-features = false }
thiserror = { version = "2", default-features = false }

# sp1 — 6.7.x ships circuit version v6.1.0 (see verifier/vk/v6.1.0).
# Pinned exactly so the lockfile, the Docker build image tag (v<version>) and
# sp1-gpu-server all agree on one version.
sp1-sdk = "=6.7.0"
sp1-zkvm = "=6.7.0"
sp1-build = "=6.7.0"
